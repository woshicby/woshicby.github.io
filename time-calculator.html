<!DOCTYPE html>
<html lang="zh-CN">
<head>
   <meta charset="UTF-8">
   <meta http-equiv="X-UA-Compatible" content="IE=edge">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>时间计算器 - BY的个人网站</title>

   <meta name="description" content="计算两个时间点之间的时间间隔，支持组合模式和各单位单独显示，以及视频时间对轨计算。">
   <meta name="keywords" content="时间计算器,时间间隔,日期差,时间差计算,对轨,视频同步">
   <meta name="author" content="woshicby">
   <meta name="robots" content="index, follow">

   <meta property="og:title" content="时间计算器 - BY的个人网站">
   <meta property="og:description" content="计算两个时间点之间的时间间隔，支持组合模式和各单位单独显示。">
   <meta property="og:type" content="website">
   <meta property="og:url" content="https://woshicby.github.io/time-calculator.html">
   <meta property="og:image" content="https://woshicby.github.io/images/profile-photo.jpg">
   <meta property="og:site_name" content="BY的个人网站">
   <meta property="og:locale" content="zh_CN">

   <meta name="twitter:card" content="summary_large_image">
   <meta name="twitter:title" content="时间计算器 - BY的个人网站">
   <meta name="twitter:description" content="计算两个时间点之间的时间间隔，支持组合模式和各单位单独显示。">
   <meta name="twitter:image" content="https://woshicby.github.io/images/profile-photo.jpg">

   <link rel="stylesheet" href="./CSS/common.css">
   <link rel="stylesheet" href="./CSS/domains/tools.css">
   <link rel="stylesheet" href="./CSS/pages/time-calculator.css">
   <link rel="icon" href="./images/favicon.ico" type="image/x-icon">
   <link rel="canonical" href="https://woshicby.github.io/time-calculator.html">

   <script src="./JS/common/navigation.js"></script>
   <script src="./JS/common/back-to-top.js"></script><!-- 返回顶部按钮 -->
   <script src="./JS/common/theme-toggle.js"></script>
   <script src="./JS/common/background-lazy-load.js"></script>
   <script src="./JS/domains/tool-tabs.js"></script>
   <script src="./JS/pages/time-calculator.js"></script>
</head>
<body>
   <div class="header clearfix wrapper">
       <h1>时间计算器</h1>
       <div class="nav">
           <ul class="clearfix">
                <li>
                   <label class="theme-toggle">
                       <input type="checkbox" id="themeToggle">
                       <span class="theme-toggle-slider"></span>
                   </label>
               </li>
            </ul>
       </div>
   </div>

   <button class="nav-toggle" aria-label="切换导航菜单" aria-expanded="false">
       <span></span>
       <span></span>
       <span></span>
   </button>

   <div class="mainbox clearfix wrapper">
       <div class="back-to-tools">
           <a href="tools.html" class="back-button">← 返回小工具&小游戏</a>
       </div>

       <div class="tool-container">
           <h2 class="tool-page-title">时间计算器</h2>
           <p class="tool-description">
               计算两个时间点之间的时间间隔，支持组合模式和各单位单独显示两种模式。也支持视频时间对轨计算。
           </p>

           <div class="tabs">
           </div>

           <div class="calculator-section">
               <div class="time-input-group">
                   <h3>开始时间</h3>
                   <div class="datetime-inputs">
                       <div class="date-inputs">
                           <div class="input-field">
                               <label for="startYear">年</label>
                               <input type="number" id="startYear" placeholder="0" min="0" max="9999">
                           </div>
                           <div class="input-field">
                               <label for="startMonth">月</label>
                               <input type="number" id="startMonth" placeholder="1" min="1" max="12">
                           </div>
                           <div class="input-field">
                               <label for="startDay">日</label>
                               <input type="number" id="startDay" placeholder="1" min="1" max="31">
                           </div>
                       </div>
                       <div class="time-inputs">
                           <div class="input-field">
                               <label for="startHour">时</label>
                               <input type="number" id="startHour" placeholder="0" min="0" max="23">
                           </div>
                           <div class="input-field">
                               <label for="startMinute">分</label>
                               <input type="number" id="startMinute" placeholder="0" min="0" max="59">
                           </div>
                           <div class="input-field">
                               <label for="startSecond">秒</label>
                               <input type="number" id="startSecond" placeholder="0" min="0" max="59">
                           </div>
                       </div>
                   </div>
               </div>

               <div class="swap-button-container">
                   <button id="swapTimes" class="swap-button" title="交换两个时间" aria-label="交换开始时间和结束时间">⇅</button>
               </div>

               <div class="time-input-group">
                   <h3>结束时间</h3>
                   <div class="datetime-inputs">
                       <div class="date-inputs">
                           <div class="input-field">
                               <label for="endYear">年</label>
                               <input type="number" id="endYear" placeholder="0" min="0" max="9999">
                           </div>
                           <div class="input-field">
                               <label for="endMonth">月</label>
                               <input type="number" id="endMonth" placeholder="1" min="1" max="12">
                           </div>
                           <div class="input-field">
                               <label for="endDay">日</label>
                               <input type="number" id="endDay" placeholder="1" min="1" max="31">
                           </div>
                       </div>
                       <div class="time-inputs">
                           <div class="input-field">
                               <label for="endHour">时</label>
                               <input type="number" id="endHour" placeholder="0" min="0" max="23">
                           </div>
                           <div class="input-field">
                               <label for="endMinute">分</label>
                               <input type="number" id="endMinute" placeholder="0" min="0" max="59">
                           </div>
                           <div class="input-field">
                               <label for="endSecond">秒</label>
                               <input type="number" id="endSecond" placeholder="0" min="0" max="59">
                           </div>
                       </div>
                   </div>
               </div>

               <div class="button-group">
                   <button id="calculate" class="calculate-button">计算时间间隔</button>
                   <button id="setNow" class="secondary-button">设为当前时间</button>
                   <button id="clearAll" class="secondary-button">清空</button>
               </div>
           </div>

           <div class="error-message" id="errorMessage" style="display: none;"></div>

           <div class="result-section" id="resultSection" style="display: none;">
               <h3>计算结果</h3>

               <div class="result-card">
                   <h4>组合模式</h4>
                   <div id="combinedResult" class="result-value"></div>
               </div>

               <div class="result-card">
                   <h4>各单位单独显示</h4>
                   <div id="unitResults" class="unit-results"></div>
               </div>
           </div>

           <!-- 对轨计算 -->
           <div class="sync-section">
               <h3>对轨计算</h3>
               <p class="sync-description">根据已知视频的实际时间与时间线位置，计算其他视频的时间线位置。</p>

               <div class="sync-reference">
                   <h4>参考点</h4>
                   <div class="sync-ref-row">
                       <div class="sync-ref-field">
                           <label for="syncRefReal">实际时间</label>
                           <input type="text" id="syncRefReal" placeholder="07:20:00" autocomplete="off">
                       </div>
                       <span class="sync-arrow">→</span>
                       <div class="sync-ref-field">
                           <label for="syncRefTimeline">时间线位置</label>
                           <input type="text" id="syncRefTimeline" placeholder="00:12:05" autocomplete="off">
                       </div>
                   </div>
               </div>

               <div class="sync-list-header">
                   <h4>待对轨视频</h4>
                   <div class="sync-list-actions">
                       <button id="syncBatchBtn" class="sync-batch-btn">批量导入</button>
                       <button id="syncAddBtn" class="sync-add-btn">+ 添加</button>
                   </div>
               </div>
               <div id="syncBatchArea" class="sync-batch-area" style="display:none;">
                   <textarea id="syncBatchInput" placeholder="每行一个文件名，如&#10;VID_20260627_074624_00_014.mp4&#10;DJI_20260621060958_0001_D.MP4" rows="4"></textarea>
                   <button id="syncBatchParse" class="sync-add-btn">解析导入</button>
               </div>
               <div id="syncList" class="sync-list"></div>

               <div class="sync-error" id="syncError" style="display: none;"></div>
           </div>
       </div>
   </div>

   <div class="foot wrapper">
       <span>Github用户：woshicby&nbsp&nbsp版权所有&copy</span>
   </div>
</body>
</html>
